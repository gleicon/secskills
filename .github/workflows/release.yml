name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        run: go test -race -count=1 ./...
      - name: version matches tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          got=$(sed -n 's/^var Version = "\(.*\)"/\1/p' version.go)
          [ "$want" = "$got" ] || { echo "tag $GITHUB_REF_NAME but version.go says $got"; exit 1; }
          for f in .claude-plugin/plugin.json manifest.json; do
            v=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' "$f" | head -1)
            [ "$want" = "$v" ] || { echo "tag $GITHUB_REF_NAME but $f says $v"; exit 1; }
          done
      - name: build
        run: make dist VERSION="${GITHUB_REF_NAME#v}"
      - name: release notes
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG.md section for ${GITHUB_REF_NAME#v}"; exit 1; }
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
