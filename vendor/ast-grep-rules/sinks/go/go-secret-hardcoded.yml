id: go-secret-hardcoded
language: go
severity: error
message: "Hardcoded credential: $VAR assigned string literal — rotate if real secret"
rule:
  all:
    - pattern: $VAR := "$SECRET"
constraints:
  VAR:
    regex: "(?i)(password|passwd|secret|apiKey|api_key|accessToken|authToken|privateKey|clientSecret)"
