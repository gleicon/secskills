id: vibe-py-console-log-credential
language: python
severity: warning
message: "Vibe: print()/logging of likely credential variable — debug output left in production"
rule:
  any:
    - pattern: print($VAR)
    - pattern: logging.info($VAR)
    - pattern: logging.debug($VAR)
    - pattern: logger.info($VAR)
    - pattern: logger.debug($VAR)
