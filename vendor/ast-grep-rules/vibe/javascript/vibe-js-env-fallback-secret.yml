id: vibe-js-env-fallback-secret
language: javascript
severity: error
message: "Vibe: hardcoded fallback for env secret — literal used when env var unset (production risk)"
rule:
  any:
    - pattern: 'process.env.$KEY || "$FALLBACK"'
    - pattern: 'process.env.$KEY ?? "$FALLBACK"'
constraints:
  KEY:
    regex: "(?i)(secret|password|token|key|auth|jwt|api)"
