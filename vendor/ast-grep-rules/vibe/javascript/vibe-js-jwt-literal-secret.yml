id: vibe-js-jwt-literal-secret
language: javascript
severity: error
message: "Vibe: JWT signed/verified with hardcoded string secret — rotate immediately"
rule:
  any:
    - pattern: jwt.sign($PAYLOAD, "$SECRET", $$$)
    - pattern: jwt.verify($TOKEN, "$SECRET", $$$)
    - pattern: sign($PAYLOAD, "$SECRET", $$$)

