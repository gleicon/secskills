id: vibe-go-hardcoded-jwt-secret
language: go
severity: error
message: "Vibe: JWT secret as hardcoded string literal — rotate immediately"
rule:
  any:
    - pattern: jwt.NewWithClaims($METHOD, $CLAIMS).SignedString([]byte("$SECRET"))
    - pattern: jwt.ParseWithClaims($TOKEN, $CLAIMS, func($T *jwt.Token) (interface{}, error) { return []byte("$SECRET"), nil })

