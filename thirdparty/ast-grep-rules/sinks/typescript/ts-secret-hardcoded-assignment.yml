id: ts-secret-hardcoded-assignment
language: typescript
severity: error
message: "Hardcoded credential: $VAR assigned string literal — rotate if real secret"
rule:
  all:
    - pattern: $VAR = "$SECRET"
constraints:
  VAR:
    regex: "(?i)(password|passwd|secret|api_key|apikey|access_token|auth_token|private_key|client_secret|db_pass)"
